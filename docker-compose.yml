# PriceDiffs — multi-service deployment
#   docker compose up -d
#   docker compose logs -f
services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: pricediff:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=pricediff.settings
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - PRICEDIFF_PROXY=${PRICEDIFF_PROXY:-}
      - PRICEDIFF_PROXY_US=${PRICEDIFF_PROXY_US:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
    volumes:
      - pricediff_data:/app/data
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: pricediff:latest
    restart: unless-stopped
    command: worker
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=pricediff.settings
      - PRICEDIFF_PROXY=${PRICEDIFF_PROXY:-}
      - PRICEDIFF_PROXY_US=${PRICEDIFF_PROXY_US:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    volumes:
      - pricediff_data:/app/data
    depends_on:
      redis: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  redis_data:
  pricediff_data:
