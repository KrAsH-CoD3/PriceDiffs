{% extends "base.html" %}

{% block title %}Sign in — PriceDiffs{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-64px)] flex items-center justify-center px-6 -mt-16">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-xl font-bold text-slate-100 mb-1.5">Welcome back</h1>
      <p class="text-sm text-slate-500">Sign in to your dashboard</p>
    </div>

    <form id="loginForm" class="bg-slate-800 border border-slate-700/60 rounded-2xl p-6 shadow-lg space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-2">Username</label>
        <input type="text" name="username" required autofocus
          class="w-full bg-slate-700/50 border border-slate-600/50 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/20 transition-all" placeholder="Enter your username" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-2">Password</label>
        <input type="password" name="password" required
          class="w-full bg-slate-700/50 border border-slate-600/50 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500/50 focus:ring-2 focus:ring-emerald-500/20 transition-all" placeholder="Enter your password" />
      </div>
      <p id="error" class="text-rose-400 text-xs font-medium hidden"></p>
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 py-2.5 rounded-xl text-sm font-semibold transition-colors">Sign in</button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
      No account? <a href="{% url 'register_page' %}" class="text-emerald-400 hover:text-emerald-300 font-medium transition-colors">Create one</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const URLS = {
    dashboard: "{% url 'dashboard' %}",
    apiLogin: "{% url 'auth_login' %}",
  };
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch(URLS.apiLogin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const json = await res.json();
    if (res.ok) {
      localStorage.setItem('access', json.access); localStorage.setItem('refresh', json.refresh);
      window.location.href = URLS.dashboard;
    } else {
      const err = document.getElementById('error');
      err.textContent = json.error || 'Login failed';
      err.classList.remove('hidden');
    }
  });
</script>
{% endblock %}
