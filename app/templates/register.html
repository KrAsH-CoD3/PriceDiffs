<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Pricediff</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-sm mx-auto p-6 mt-16">
    <h1 class="text-2xl font-bold mb-6 text-center">Create account</h1>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Username</label>
        <input type="text" name="username" required
          class="w-full border rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email (optional)</label>
        <input type="email" name="email"
          class="w-full border rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" required minlength="8"
          class="w-full border rounded-lg px-3 py-2 text-sm" />
        <p class="text-xs text-gray-400 mt-1">At least 8 characters</p>
      </div>
      <p id="error" class="text-red-600 text-sm hidden"></p>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700">
        Create account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Already have one? <a href="/login" class="text-blue-600 underline">Sign in</a>
    </p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (res.ok) {
        localStorage.setItem('access', json.access);
        localStorage.setItem('refresh', json.refresh);
        window.location.href = '/';
      } else {
        const err = document.getElementById('error');
        err.textContent = Object.values(json).flat().join(', ') || 'Registration failed';
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
