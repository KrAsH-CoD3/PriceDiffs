<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Product — PriceDiffs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeSlideIn 0.4s ease-out; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-4xl mx-auto p-6">
    <header class="flex items-center justify-between mb-8">
      <div>
        <a href="/" class="text-blue-600 text-sm">&larr; Dashboard</a>
        <h1 id="productTitle" class="text-2xl font-bold mt-2">Loading...</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="username" class="text-sm text-gray-500"></span>
        <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-600 hidden">Logout</button>
      </div>
    </header>

    <div id="content" class="space-y-6">
      <div class="text-center py-12 text-gray-400">Loading...</div>
    </div>
  </div>

  <script>
    const ACCESS = localStorage.getItem('access');
    const PRODUCT_ID = {{ product_id }};

    async function api(path, options = {}) {
      const headers = { ...options.headers };
      if (ACCESS) headers['Authorization'] = `Bearer ${ACCESS}`;
      if (options.body && !(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }
      return fetch(path, { ...options, headers });
    }

    async function checkAuth() {
      if (!ACCESS) {
        window.location.href = '/login';
        return;
      }
      const res = await api('/api/auth/me');
      if (!res.ok) {
        localStorage.removeItem('access');
        localStorage.removeItem('refresh');
        window.location.href = '/login';
        return;
      }
      const text = await res.text();
      let user;
      try { user = JSON.parse(text); } catch(e) {
        document.getElementById('content').innerHTML =
          `<div class="col-span-full text-center py-12 text-red-400">Auth error.</div>`;
        return;
      }
      document.getElementById('username').textContent = user.username;
      document.getElementById('logoutBtn').classList.remove('hidden');
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      localStorage.removeItem('access');
      localStorage.removeItem('refresh');
      window.location.href = '/login';
    });

    function currencySymbol(currency) {
      return currency === 'NGN' ? '\u20A6' : '$';
    }

    function formatPrice(num) {
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ── Toast system ──────────────────────────────────────────────
    function showToast(msg, type = 'info') {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        document.body.appendChild(el);
      }
      const colors = { info: 'border-blue-400 text-blue-800 bg-blue-50', success: 'border-green-500 text-green-800 bg-green-50', error: 'border-red-400 text-red-800 bg-red-50' };
      el.className = `fixed top-4 right-4 z-50 max-w-md border-2 rounded-lg shadow-xl p-4 text-sm font-medium transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.classList.add('hidden'); }, 8000);
    }

    async function loadProduct() {
      try {
        const res = await api(`/api/products/${PRODUCT_ID}`);
        const text = await res.text();
        if (!res.ok) {
          document.getElementById('content').innerHTML =
            `<div class="text-center py-12 text-red-400">Product not found.</div>`;
          return;
        }
        const p = JSON.parse(text);
        const snapshots = p.snapshots || [];
        const latest = snapshots.length > 0 ? snapshots[0] : null;
        const sym = latest ? currencySymbol(latest.currency) : '$';

        document.getElementById('pageTitle').textContent = (p.title || 'Product') + ' — PriceDiffs';
        document.getElementById('productTitle').textContent = p.title || 'Untitled';

        let html = '';

        // Product info card
        html += `
          <div class="bg-white rounded-xl shadow-sm border p-6 flex flex-col sm:flex-row gap-6">
            ${p.image_url ? `<img src="${p.image_url}" referrerpolicy="no-referrer" class="w-40 h-40 object-contain rounded-lg shrink-0" />` : ''}
            <div class="flex-1 min-w-0">
              <a href="${p.url}" target="_blank" class="text-blue-600 text-sm hover:underline block mb-2 truncate">${p.url}</a>
              ${p.rating ? `<span class="text-yellow-500 text-sm">★ ${p.rating}</span>` : ''}
              <div class="mt-4 text-3xl font-bold" id="priceDisplay">
                ${latest
                  ? `${sym}${formatPrice(latest.price)}`
                  : `<span class="inline-flex items-center gap-2 text-gray-400 text-lg">
                      <span class="inline-block w-5 h-5 border-2 border-gray-300 border-t-blue-500 rounded-full animate-spin"></span>
                      Fetching price…
                    </span>`}
              </div>
              <div class="mt-1 text-sm text-gray-500">
                ${p.price_change_24h !== null ? `
                  <span class="${p.price_change_24h < 0 ? 'text-green-600' : p.price_change_24h > 0 ? 'text-red-600' : ''}">
                    ${p.price_change_24h > 0 ? '▲' : p.price_change_24h < 0 ? '▼' : ''}
                    ${sym}${formatPrice(Math.abs(p.price_change_24h))} (24h)
                  </span>
                ` : ''}
              </div>
              <div class="mt-2 text-sm text-gray-500">
                ${p.lowest_price !== null ? `Low: ${sym}${formatPrice(p.lowest_price)}` : ''}
                ${p.highest_price !== null ? ` · High: ${sym}${formatPrice(p.highest_price)}` : ''}
              </div>
              ${latest ? `<div id="snapshotMeta" class="mt-1 text-xs text-gray-400">${snapshots.length} snapshot${snapshots.length !== 1 ? 's' : ''} · ${new Date(latest.scraped_at).toLocaleString()}</div>` : ''}
            </div>
          </div>
        `;

        // Price chart (mini bar chart of all snapshots)
        if (snapshots.length > 0) {
          const sorted = [...snapshots].reverse(); // chronological
          const highs = sorted.map(s => s.price);
          const maxP = Math.max(...highs);
          const minP = Math.min(...highs);
          const range = maxP - minP || 1;

          html += `
            <div class="bg-white rounded-xl shadow-sm border p-6">
              <h2 class="text-lg font-semibold mb-4">Price History</h2>
              <div class="h-40 flex items-end gap-[3px]">
                ${sorted.map(sp => {
                  const pct = (sp.price - minP) / range;
                  const spSym = currencySymbol(sp.currency);
                  return `<div class="flex-1 bg-blue-500 rounded-t hover:bg-blue-600 relative group" style="height:${Math.max(6, pct * 100)}%" title="${spSym}${formatPrice(sp.price)} — ${new Date(sp.scraped_at).toLocaleString()}">
                    <div class="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap pointer-events-none z-10">
                      ${spSym}${formatPrice(sp.price)}<br>${new Date(sp.scraped_at).toLocaleString()}
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `;
        }

        // Snapshot table
        if (snapshots.length > 0) {
          html += `
            <div class="bg-white rounded-xl shadow-sm border p-6">
              <h2 class="text-lg font-semibold mb-4">All Snapshots (${snapshots.length})</h2>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="text-left text-gray-500 border-b">
                      <th class="pb-2 pr-4">Date</th>
                      <th class="pb-2 pr-4">Price</th>
                      <th class="pb-2">Currency</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${snapshots.map(sp => `
                      <tr class="border-b last:border-0">
                        <td class="py-2 pr-4 text-gray-600">${new Date(sp.scraped_at).toLocaleString()}</td>
                        <td class="py-2 pr-4 font-medium">${currencySymbol(sp.currency)}${formatPrice(sp.price)}</td>
                        <td class="py-2 text-gray-500">${sp.currency}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="bg-white rounded-xl shadow-sm border p-6 text-center text-gray-400">
              <p class="mb-2">Waiting for first price check…</p>
              <p class="text-sm">We'll have pricing data for you shortly.</p>
            </div>
          `;
        }

        // Action buttons
        html += `
          <div class="flex gap-3">
            <button id="deleteBtn" class="bg-red-600 text-white px-5 py-2 rounded-lg text-sm hover:bg-red-700">Delete Product</button>
          </div>
        `;

        document.getElementById('content').innerHTML = html;

        // Attach delete handler
        document.getElementById('deleteBtn').addEventListener('click', async () => {
          if (!confirm('Delete this product and all its snapshots?')) return;
          const delRes = await api(`/api/products/${PRODUCT_ID}`, { method: 'DELETE' });
          if (delRes.ok || delRes.status === 204) {
            window.location.href = '/';
          } else {
            alert('Failed to delete product');
          }
        });

      } catch (e) {
        document.getElementById('content').innerHTML =
          `<div class="text-center py-12 text-red-400">Error: ${e.message}</div>`;
      }
    }

    function updatePriceDisplay(html) {
      const el = document.getElementById('priceDisplay');
      if (el) { el.innerHTML = html; el.classList.add('fade-in'); }
    }

    function updateProductDetails(title, imageUrl, rating) {
      if (title) {
        document.getElementById('pageTitle').textContent = title + ' \u2014 PriceDiffs';
        document.getElementById('productTitle').textContent = title;
      }
      if (imageUrl) {
        let img = document.querySelector('#content div:first-child img');
        if (!img && imageUrl) {
          const container = document.querySelector('#content div:first-child .flex-1.min-w-0');
          if (container) {
            const parent = container.closest('.flex');
            if (parent) {
              parent.insertAdjacentHTML('afterbegin', `<img src="${imageUrl}" referrerpolicy="no-referrer" class="w-40 h-40 object-contain rounded-lg shrink-0" />`);
            }
          }
        } else if (img) {
          img.src = imageUrl;
        }
      }
      if (rating) {
        const container = document.querySelector('#content .flex-1.min-w-0');
        if (container) {
          let star = container.querySelector('.text-yellow-500');
          if (star) {
            star.textContent = '\u2605 ' + rating;
          } else {
            const urlLink = container.querySelector('a[href]');
            if (urlLink) {
              urlLink.insertAdjacentHTML('afterend', `<span class="text-yellow-500 text-sm">\u2605 ${rating}</span>`);
            }
          }
        }
      }
    }

    // ── Event polling ─────────────────────────────────────────────
    let sseLastId = 0;
    let pollTimer = null;
    let pollDone = false;

    async function pollEvents() {
      if (pollDone) return;
      try {
        const res = await api(`/api/events/poll?last_id=${sseLastId}`);
        if (!res.ok) return;
        const events = await res.json();
        for (const ev of events) {
          if (ev.product_id !== PRODUCT_ID) continue;
          sseLastId = Math.max(sseLastId, ev.id);
          if (ev.event_type === 'scraping') {
            updateProductDetails(ev.title, ev.product_image_url, ev.product_rating);
            const priceDisplay = document.getElementById('priceDisplay');
            if (priceDisplay && !priceDisplay.querySelector('.scraping-badge')) {
              const hasPrice = /^[$₦]/.test(priceDisplay.textContent.trim());
              if (hasPrice) {
                const originalHTML = priceDisplay.innerHTML;
                priceDisplay.innerHTML = `
                  <div class="flex items-center gap-2 text-blue-500 mb-2 text-sm scraping-badge">
                    <span class="inline-block w-4 h-4 border-2 border-blue-300 border-t-blue-600 rounded-full animate-spin"></span>
                    <span class="font-medium">Updating price…</span>
                  </div>
                  <div class="text-3xl font-bold">${originalHTML.trim()}</div>
                `;
              } else {
                updatePriceDisplay(`<span class="inline-flex items-center gap-2 text-blue-500 text-lg">
                  <span class="inline-block w-5 h-5 border-2 border-blue-300 border-t-blue-600 rounded-full animate-spin"></span>
                  <span class="font-medium">Scraping price…</span>
                </span>`);
              }
            }
          } else if (ev.event_type === 'completed') {
            pollDone = true;
            updateProductDetails(ev.title, ev.image_url, ev.rating);
            loadProduct();
          } else if (ev.event_type === 'failed') {
            pollDone = true;
            updateProductDetails(ev.title, ev.product_image_url, ev.product_rating);
            const priceDisplay = document.getElementById('priceDisplay');
            if (priceDisplay) {
              const hasPrice = /^[$₦]/.test(priceDisplay.textContent.trim());
              if (hasPrice) {
                const price = priceDisplay.textContent.trim();
                updatePriceDisplay(`<div class="text-red-400 text-sm fade-in">⚠ Update failed — will retry</div><div class="text-3xl font-bold">${price}</div>`);
              } else {
                updatePriceDisplay(`<span class="text-red-400 text-lg fade-in">⚠ Scrape failed — will retry</span>`);
              }
            }
          } else if (ev.event_type === 'unavailable') {
            pollDone = true;
            updateProductDetails(ev.title, ev.image_url || ev.product_image_url, ev.rating || ev.product_rating);
            const sym = ev.currency === 'NGN' ? '\u20A6' : '$';
            const priceStr = ev.price != null ? `${sym}${formatPrice(ev.price)}` : '';
            updatePriceDisplay(`
              <div class="text-amber-500 text-sm fade-in">📢 No longer available</div>
              ${priceStr ? `<div class="text-3xl font-bold mt-1 opacity-70">${priceStr}</div>` : ''}
              ${ev.scraped_at ? `<div class="text-xs text-gray-400 mt-1">Last updated: ${new Date(ev.scraped_at).toLocaleString()}</div>` : ''}
            `);
          }
        }
      } catch(e) {
        console.error('Poll error', e);
      }
      if (!pollDone) {
        pollTimer = setTimeout(pollEvents, 1500);
      }
    }

    checkAuth().then(async () => {
      try {
        const res = await api('/api/events/max-id');
        if (res.ok) sseLastId = await res.json();
      } catch(_) {}
      await loadProduct();
      const priceDisplay = document.getElementById('priceDisplay');
      const needsPoll = priceDisplay && priceDisplay.querySelector('.animate-spin');
      if (needsPoll) {
        pollTimer = setTimeout(pollEvents, 1500);
      }
    });
  </script>
</body>
</html>
