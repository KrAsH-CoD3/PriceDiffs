[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:web]
command=bash -c "Xvfb :99 -screen 0 1024x768x24 -ac & sleep 0.5 && python manage.py migrate --noinput && gunicorn pricediff.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${GUNICORN_WORKERS:-2} --threads 2 --timeout 120 --access-logfile - --error-logfile - --log-level ${LOG_LEVEL:-info}"
directory=/app
environment=DISPLAY=":99",PATH="/app/.venv/bin:%(ENV_PATH)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=bash -c "celery -A pricediff worker --loglevel=${LOG_LEVEL:-info} --concurrency=${CELERY_CONCURRENCY:-2} --max-tasks-per-child=${CELERY_MAX_TASKS:-100}"
directory=/app
environment=PATH="/app/.venv/bin:%(ENV_PATH)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
